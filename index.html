    // ------------------------------------------------------------
    // ذخیره رکورد
    // ------------------------------------------------------------

    function loadBest() {
      try {
        const value = Number(
          localStorage.getItem(STORAGE_KEY)
        );

        return Number.isFinite(value)
          ? Math.max(0, value)
          : 0;
      } catch {
        return 0;
      }
    }

    function saveBest(value) {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          String(value)
        );
      } catch {
        // اگر مرورگر اجازه ذخیره نداد، بازی همچنان اجرا می‌شود.
      }
    }

    // ------------------------------------------------------------
    // اندازه صفحه
    // ------------------------------------------------------------

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      pixelRatio = Math.min(
        window.devicePixelRatio || 1,
        2
      );

      scale = Math.max(
        0.65,
        Math.min(
          width / 420,
          height / 720,
          1.55
        )
      );

      W = width / scale;
      H = height / scale;

      canvas.width = Math.round(
        width * pixelRatio
      );

      canvas.height = Math.round(
        height * pixelRatio
      );

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      game.player.y = playerY();

      if (game.state !== "run") {
        game.player.x = laneCenter(
          game.player.lane,
          game.player.y
        );
      }
    }

    function playerY() {
      return H - Math.max(
        150,
        H * 0.175
      );
    }

    // ------------------------------------------------------------
    // هندسه جاده
    // ------------------------------------------------------------

    function roadCenter(y, distance = game.distance) {
      const depth = 1 - y / H;

      return W / 2 +
        Math.sin(
          distance / 240 +
          depth * 2.15
        ) *
        22 *
        depth;
    }

    function roadHalfWidth(y) {
      const bottomWidth = Math.min(
        185,
        Math.max(136, W * 0.39)
      );

      const progress = Math.max(
        0,
        Math.min(1, y / H)
      );

      return bottomWidth *
        (0.82 + progress * 0.18);
    }

    function laneCenter(
      lane,
      y,
      distance = game.distance
    ) {
      const laneWidth =
        (roadHalfWidth(y) * 2) / 3;

      return roadCenter(
        y,
        distance
      ) +
      (lane - 1) * laneWidth;
    }

    function perspective(y) {
      return 0.75 +
        Math.max(
          0,
          Math.min(1, y / H)
        ) * 0.25;
    }

    // ------------------------------------------------------------
    // ابزار رسم
    // ------------------------------------------------------------

    function roundedRect(
      x,
      y,
      width,
      height,
      radius
    ) {
      radius = Math.min(
        radius,
        width / 2,
        height / 2
      );

      ctx.beginPath();

      ctx.moveTo(
        x + radius,
        y
      );

      ctx.lineTo(
        x + width - radius,
        y
      );

      ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
      );

      ctx.lineTo(
        x + width,
        y + height - radius
      );

      ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
      );

      ctx.lineTo(
        x + radius,
        y + height
      );

      ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
      );

      ctx.lineTo(
        x,
        y + radius
      );

      ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
      );

      ctx.closePath();
    }

    function fillRounded(
      x,
      y,
      width,
      height,
      radius,
      color
    ) {
      ctx.fillStyle = color;

      roundedRect(
        x,
        y,
        width,
        height,
        radius
      );

      ctx.fill();
    }

    function drawLine(
      x1,
      y1,
      x2,
      y2,
      color,
      width
    ) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function showToast(text) {
      toastElement.textContent = text;

      toastElement.classList.add(
        "show"
      );

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toastElement.classList.remove(
          "show"
        );
      }, 1300);
    }

    function flash() {
      flashElement.classList.add(
        "active"
      );

      setTimeout(() => {
        flashElement.classList.remove(
          "active"
        );
      }, 90);
    }

        ) {
          audioContext.resume();
        }
      } catch {

    }
